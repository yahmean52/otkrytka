<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Открытка с любовью</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card" id="card">
        <div class="card-inner">
            <div class="card-front">
                <!-- Лицевая сторона: просто красивая открытка -->
                <img src="fon.jpg" alt="Открытка" style="width:100%; height:100%; object-fit: cover;">
            </div>
            <div class="card-back">
                <!-- Внутренняя сторона: надпись -->
                <p>🌹 Я тебя люблю! 🌹</p>
            </div>
        </div>
    </div>

    <script>
        // JavaScript добавим прямо здесь для простоты
        const card = document.getElementById('card');
        card.addEventListener('click', () => {
            card.classList.toggle('open');
        });
    </script>
</body>
</html>
